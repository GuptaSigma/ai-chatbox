<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Brightlant Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white border-b p-4 flex justify-between items-center max-w-4xl mx-auto w-full">
        <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">🤖 AI Assistant</h1>
        <button onclick="clearChat()" class="text-sm bg-red-50 text-red-600 px-3 py-1.5 rounded hover:bg-red-100 transition">
            Clear Chat
        </button>
    </header>

    <!-- Chat Messages Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 max-w-4xl mx-auto w-full space-y-4">
        <!-- Messages will be injected here -->
    </div>

    <!-- Typing Indicator -->
    <div id="loading" class="hidden max-w-4xl mx-auto w-full px-4 mb-2 text-gray-500 text-sm italic">
        AI is thinking...
    </div>

    <!-- Input Form -->
    <div class="bg-white border-t p-4 max-w-4xl mx-auto w-full">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Type your message..." 
                   class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            <button type="submit" id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-medium">
                Send
            </button>
        </form>
    </div>

    <script>
        let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const loading = document.getElementById('loading');

        // Render existing history on load
        function renderChat() {
            chatContainer.innerHTML = '';
            if (chatHistory.length === 0) {
                chatContainer.innerHTML = `<p class="text-center text-gray-400 mt-10">Start a conversation!</p>`;
                return;
            }
            chatHistory.forEach(msg => {
                const isUser = msg.role === 'user';
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = `p-3 rounded-lg max-w-[80%] ${isUser ? 'bg-blue-600 text-white' : 'bg-white border text-gray-800'}`;
                
                // Parse markdown for AI, raw text for user
                contentDiv.innerHTML = isUser ? msg.content : marked.parse(msg.content);
                msgDiv.appendChild(contentDiv);
                chatContainer.appendChild(msgDiv);
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Send Message Handler
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            chatHistory.push({ role: 'user', content: text });
            userInput.value = '';
            renderChat();

            loading.classList.remove('hidden');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to fetch');

                chatHistory.push({ role: 'assistant', content: data.content });
                localStorage.setItem('chat_history', JSON.stringify(chatHistory));
            } catch (err) {
                chatHistory.push({ role: 'assistant', content: `⚠️ **Error:** ${err.message}` });
            } finally {
                loading.classList.add('hidden');
                renderChat();
            }
        });

        // Clear Chat Feature
        function clearChat() {
            chatHistory = [];
            localStorage.removeItem('chat_history');
            renderChat();
        }

        renderChat();
    </script>
</body>
</html>
