<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Brightlant Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans">

    <header class="bg-white border-b p-4 flex justify-between items-center max-w-4xl mx-auto w-full">
        <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">🤖 AI Assistant</h1>
        <button onclick="clearChat()" class="text-sm bg-red-50 text-red-600 px-3 py-1.5 rounded hover:bg-red-100 transition">
            Clear Chat
        </button>
    </header>

    <div id="chat-container" class="flex-1 overflow-y-auto p-4 max-w-4xl mx-auto w-full space-y-4"></div>

    <div id="loading" class="hidden max-w-4xl mx-auto w-full px-4 mb-2 text-gray-500 text-sm italic">
        AI is thinking...
    </div>

    <div class="bg-white border-t p-4 max-w-4xl mx-auto w-full">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Type your message..." 
                   class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            <button type="submit" id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-medium">
                Send
            </button>
        </form>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
